<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>跑圈占地 · 原型</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC",sans-serif}
  #map{position:absolute;inset:0}
  #hud{position:absolute;left:12px;right:12px;bottom:18px;z-index:999;
       background:#fff;border-radius:16px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
  #hud .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  #stat{font-size:13px;color:#666;line-height:1.5}
  #stat b{color:#111;font-size:15px}
  #btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:600;
       color:#fff;background:#ff5a3c}
  #btn.stop{background:#333}
  #toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:999;
        background:rgba(0,0,0,.78);color:#fff;padding:9px 16px;border-radius:20px;
        font-size:14px;opacity:0;transition:.3s;pointer-events:none}
  #toast.show{opacity:1}
  .lord{background:none;border:none}
  .lord-inner{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;color:#fff;font-size:22px;border:3px solid #fff;
    box-shadow:0 3px 10px rgba(0,0,0,.35);overflow:hidden}
  .lord-inner img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="map"></div>
<div id="toast"></div>
<div id="hud">
  <div class="row">
    <div id="stat">距离 <b id="d">0</b> m ｜ 领地 <b id="c">0</b> 块</div>
    <div style="font-size:12px;color:#999" id="gps">GPS 待启动</div>
  </div>
  <button id="btn">开始跑步</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============ 玩法参数：改这里就能调平衡 ============ */
const CFG = {
  minLoopLength: 400,     // 至少跑这么远(米)才检查是否闭合
  closeThreshold: 30,     // 首尾点距离小于这个值 = 闭合(米)
  minArea: 3000,          // 最小占领面积(平方米)
  maxAccuracy: 35,        // GPS 精度差于此值(米)丢弃该点
  minMove: 4,             // 移动小于此距离不记录(米)，过滤抖动
  simplifyTol: 8          // 抽稀容差(米)
};

const USER = {
  name: '跑步的我',
  color: '#ff5a3c',
  avatar: 'https://api.dicebear.com/7.x/thumbs/svg?seed=runner'  // 换成自己的头像URL
};

/* ============ 地图 ============ */
const map = L.map('map', { zoomControl: false }).setView([39.9042, 116.4074], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

/* ============ 状态 ============ */
let running = false, watchId = null;
let pts = [];                 // 当前轨迹点 {lat,lng,t}
let liveLine = null;
let territories = [];         // 已占领的圈
let gpsOk = false;

const $ = id => document.getElementById(id);

/* ============ 工具函数 ============ */
const R = 6378137;
const rad = d => d * Math.PI / 180;

function hav(a, b) {          // 两点距离(米)
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const s = Math.sin(dLat/2)**2 +
            Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

function pathLength(arr) {     // 轨迹总长
  let d = 0;
  for (let i = 1; i < arr.length; i++) d += hav(arr[i-1], arr[i]);
  return d;
}

function toXY(p, lat0) {       // 等距近似投影，用于面积/几何判断
  return [rad(p.lng) * R * Math.cos(rad(lat0)), rad(p.lat) * R];
}

function areaM2(poly) {        // 多边形面积（球面近似）
  if (poly.length < 3) return 0;
  const lat0 = poly.reduce((s,p) => s + p.lat, 0) / poly.length;
  const xy = poly.map(p => toXY(p, lat0));
  let a = 0;
  for (let i = 0; i < xy.length; i++) {
    const j = (i + 1) % xy.length;
    a += xy[i][0] * xy[j][1] - xy[j][0] * xy[i][1];
  }
  return Math.abs(a) / 2;
}

function perpDist(p, a, b) {   // 点到线段距离(米)
  const lat0 = (a.lat + b.lat) / 2;
  const P = toXY(p, lat0), A = toXY(a, lat0), B = toXY(b, lat0);
  const dx = B[0]-A[0], dy = B[1]-A[1], len = Math.hypot(dx, dy);
  if (len === 0) return Math.hypot(P[0]-A[0], P[1]-A[1]);
  return Math.abs(dy*P[0] - dx*P[1] + B[0]*A[1] - B[1]*A[0]) / len;
}

function simplify(points, tol) {   // Douglas-Peucker 抽稀
  if (points.length < 3) return points.slice();
  let maxD = -1, idx = 0;
  const first = points[0], last = points[points.length-1];
  for (let i = 1; i < points.length - 1; i++) {
    const d = perpDist(points[i], first, last);
    if (d > maxD) { maxD = d; idx = i; }
  }
  if (maxD > tol) {
    const l = simplify(points.slice(0, idx + 1), tol);
    const r = simplify(points.slice(idx), tol);
    return l.slice(0, -1).concat(r);
  }
  return [first, last];
}

function cross(o, a, b) {
  return (a.lng-o.lng)*(b.lat-o.lat) - (a.lat-o.lat)*(b.lng-o.lng);
}
function segIntersect(p1,p2,p3,p4) {
  const d1 = cross(p3,p4,p1), d2 = cross(p3,p4,p2);
  const d3 = cross(p1,p2,p3), d4 = cross(p1,p2,p4);
  return ((d1>0&&d2<0)||(d1<0&&d2>0)) && ((d3>0&&d4<0)||(d3<0&&d4>0));
}
function isSimple(poly) {      // 自交检测（"8"字形轨迹不算合法圈）
  const n = poly.length;
  for (let i = 0; i < n; i++) {
    for (let j = i + 2; j < n; j++) {
      if (i === 0 && j === n - 1) continue;
      if (segIntersect(poly[i], poly[(i+1)%n], poly[j], poly[(j+1)%n])) return false;
    }
  }
  return true;
}

function centroid(poly) {      // 面积质心，用来放头像
  const lat0 = poly.reduce((s,p) => s + p.lat, 0) / poly.length;
  const xy = poly.map(p => toXY(p, lat0));
  let cx = 0, cy = 0, a = 0;
  for (let i = 0; i < xy.length; i++) {
    const j = (i+1) % xy.length;
    const f = xy[i][0]*xy[j][1] - xy[j][0]*xy[i][1];
    a += f; cx += (xy[i][0]+xy[j][0])*f; cy += (xy[i][1]+xy[j][1])*f;
  }
  a *= 0.5; cx /= (6*a); cy /= (6*a);
  const cosLat = Math.cos(rad(lat0));
  return { lat: (cy / R) * 180 / Math.PI, lng: (cx / (R*cosLat)) * 180 / Math.PI };
}

/* ============ 核心：判断是否形成了闭合圈 ============ */
function findLoopStart(points) {
  const last = points[points.length - 1];
  let dist = 0;
  for (let i = points.length - 2; i >= 0; i--) {
    dist += hav(points[i], points[i + 1]);
    if (dist < CFG.minLoopLength) continue;      // 太短，还不能算圈
    if (hav(points[i], last) < CFG.closeThreshold) return i;  // 回到起点了！
  }
  return -1;
}

/* ============ 占领 ============ */
function tryClaim() {
  const start = findLoopStart(pts);
  if (start < 0) return false;

  const poly = simplify(pts.slice(start), CFG.simplifyTol);
  if (poly.length < 3) return false;

  const area = areaM2(poly);
  if (area < CFG.minArea) { toast(`圆的圈只有 ${Math.round(area)}㎡，再大一点`); return false; }
  if (!isSimple(poly))    { toast('轨迹有交叉，没法算面积哦'); return false; }

  drawTerritory(poly, area);
  territories.push(poly);
  save();

  // 从当前点开始新的一段
  pts = [pts[pts.length - 1]];
  updateStat();
  toast(`🎉 占领成功！${Math.round(area)} 平方米`);
  return true;
}

function drawTerritory(poly, area) {
  const latlngs = poly.map(p => [p.lat, p.lng]);
  L.polygon(latlngs, {
    color: USER.color, weight: 2, fillColor: USER.color, fillOpacity: 0.32
  }).addTo(map).bindPopup(`<b>${USER.name}</b><br>面积 ${Math.round(area)} ㎡`);

  const c = centroid(poly);
  L.marker([c.lat, c.lng], {
    icon: L.divIcon({
      className: 'lord',
      html: `<div class="lord-inner" style="background:${USER.color}">
               <img src="${USER.avatar}" onerror="this.remove()">
             </div>`,
      iconSize: [48, 48], iconAnchor: [24, 24]
    })
  }).addTo(map);
}

/* ============ 轨迹记录 ============ */
function onPos(pos) {
  gpsOk = true;
  const { latitude: lat, longitude: lng, accuracy } = pos.coords;
  $('gps').textContent = `GPS ±${Math.round(accuracy)}m`;
  $('gps').style.color = accuracy > 30 ? '#e08b00' : '#3aa76d';

  if (!running) return;
  if (accuracy > CFG.maxAccuracy) return;        // 精度太差，丢弃

  const p = { lat, lng, t: Date.now() };
  const last = pts[pts.length - 1];
  if (last && hav(last, p) < CFG.minMove) return;  // 原地抖动不记录

  pts.push(p);
  if (pts.length > 3000) pts.shift();

  if (!liveLine) {
    liveLine = L.polyline([[p.lat, p.lng]], { color: USER.color, weight: 5, opacity: .85 }).addTo(map);
  } else {
    liveLine.addLatLng([p.lat, p.lng]);
  }
  map.panTo([p.lat, p.lng], { animate: true, duration: .4 });

  if (!tryClaim()) updateStat();
}

function onErr(e) {
  gpsOk = false;
  $('gps').textContent = 'GPS 不可用';
  toast('定位失败：' + e.message);
}

function updateStat() {
  $('d').textContent = Math.round(pathLength(pts));
  $('c').textContent = territories.length;
}

/* ============ 按钮 ============ */
$('btn').onclick = () => {
  if (!running) {
    running = true;
    pts = []; 
    if (liveLine) { map.removeLayer(liveLine); liveLine = null; }
    $('btn').textContent = '结束跑步';
    $('btn').classList.add('stop');
    watchId = navigator.geolocation.watchPosition(onPos, onErr, {
      enableHighAccuracy: true, maximumAge: 0, timeout: 15000
    });
    toast('开始记录，跑个圈回来～');
  } else {
    running = false;
    navigator.geolocation.clearWatch(watchId);
    $('btn').textContent = '开始跑步';
    $('btn').classList.remove('stop');
    if (liveLine) { map.removeLayer(liveLine); liveLine = null; }
  }
};

/* ============ 本地存储（换成后端后删掉） ============ */
const KEY = 'run_territories_v1';
function save() {
  localStorage.setItem(KEY, JSON.stringify(
    territories.map(p => p.map(({lat, lng}) => [lat, lng]))
  ));
}
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || '[]');
    raw.forEach(arr => {
      const poly = arr.map(([lat, lng]) => ({ lat, lng }));
      territories.push(poly);
      drawTerritory(poly, areaM2(poly));
    });
  } catch (e) {}
  updateStat();
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ============ 启动 ============ */
navigator.geolocation.getCurrentPosition(
  p => { map.setView([p.coords.latitude, p.coords.longitude], 16); onPos(p); },
  onErr, { enableHighAccuracy: true, timeout: 10000 }
);
load();
</script>
</body>
</html>
